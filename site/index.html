<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manpower Attendance — Live Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a237e; --primary-light: #283593; --secondary: #ff6f00;
            --accent: #00bcd4; --dark: #1a1a2e; --gray: #64748b; --light: #f1f5f9;
            --white: #fff; --green: #16a34a; --red: #dc2626; --amber: #d97706;
            --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.1); --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); color: var(--dark); }
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; width: 230px;
            background: linear-gradient(180deg, var(--primary), var(--dark));
            color: var(--white); padding: 1.5rem 0; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: .6rem; padding: 0 1.5rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,.12); }
        .brand i { font-size: 1.6rem; color: var(--secondary); }
        .brand h2 { font-size: 1.1rem; line-height: 1.2; }
        .brand small { color: #94a3b8; font-weight: 400; font-size: .72rem; }
        .nav-item { display: flex; align-items: center; gap: .8rem; padding: .85rem 1.5rem; cursor: pointer; transition: all .2s; color: #cbd5e1; font-weight: 500; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,.08); color: var(--white); }
        .nav-item.active { background: rgba(255,111,0,.15); color: var(--white); border-left-color: var(--secondary); }
        .nav-item i { width: 20px; text-align: center; }
        .main { margin-left: 230px; min-height: 100vh; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .topbar h1 { font-size: 1.6rem; }
        .topbar .date { color: var(--gray); font-weight: 500; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
        .card { background: var(--white); border-radius: 12px; padding: 1.4rem; box-shadow: var(--shadow); border-top: 3px solid var(--primary); }
        .card .label { color: var(--gray); font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
        .card .value { font-size: 2rem; font-weight: 700; margin-top: .4rem; color: var(--dark); }
        .card .sub { font-size: .8rem; color: var(--gray); margin-top: .2rem; }
        .card.green { border-top-color: var(--green); } .card.orange { border-top-color: var(--secondary); }
        .card.red { border-top-color: var(--red); } .card.cyan { border-top-color: var(--accent); }
        .panel { background: var(--white); border-radius: 12px; box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 1.5rem; }
        .panel h3 { margin-bottom: 1rem; font-size: 1.1rem; }
        .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.2rem; border: none; border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: all .2s; }
        .btn-primary { background: var(--primary); color: var(--white); } .btn-primary:hover { background: var(--primary-light); }
        .btn-accent { background: var(--secondary); color: var(--white); } .btn-accent:hover { filter: brightness(1.1); }
        .btn-ghost { background: var(--light); color: var(--dark); border: 1px solid var(--border); } .btn-ghost:hover { background: var(--border); }
        .btn-danger { background: var(--red); color: var(--white); } .btn-danger:hover { filter: brightness(1.1); }
        .btn-green { background: var(--green); color: var(--white); }
        .btn-sm { padding: .35rem .7rem; font-size: .8rem; }
        .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th { background: #f8fafc; color: #475569; text-transform: uppercase; font-size: .74rem; letter-spacing: .05em; padding: .8rem .9rem; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap; }
        td { padding: .7rem .9rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover td { background: #f8fafc; }
        .badge { display: inline-block; padding: .2rem .7rem; border-radius: 12px; font-size: .75rem; font-weight: 600; }
        .badge-green { background: #dcfce7; color: var(--green); } .badge-red { background: #fee2e2; color: var(--red); }
        .badge-gray { background: #e2e8f0; color: #475569; } .badge-amber { background: #fef3c7; color: var(--amber); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: .65rem .8rem; border: 2px solid var(--border); border-radius: 8px; font-size: .9rem; transition: border-color .2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        .toolbar { display: flex; gap: .8rem; flex-wrap: wrap; align-items: end; margin-bottom: 1.2rem; }
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 500; align-items: flex-start; justify-content: center; padding: 4rem 1rem; overflow-y: auto; }
        .modal-backdrop.active { display: flex; }
        .modal { background: var(--white); border-radius: 14px; width: 100%; max-width: 520px; animation: pop .2s ease; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .modal-head h3 { font-size: 1.1rem; margin: 0; } .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--gray); }
        .modal-body { padding: 1.5rem; }
        .import-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; transition: all .2s; background: #f8fafc; }
        .import-zone:hover, .import-zone.drag { border-color: var(--primary); background: #eef2ff; }
        .import-zone i { font-size: 2.5rem; color: var(--primary); margin-bottom: .8rem; }
        .import-zone p { color: var(--gray); }
        .sum { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: .8rem; }
        .sum .chip { padding: .5rem 1rem; border-radius: 8px; font-size: .85rem; font-weight: 600; }
        .chip-blue { background: #e0f2fe; color: #0369a1; } .chip-green { background: #dcfce7; color: var(--green); } .chip-red { background: #fee2e2; color: var(--red); } .chip-gray { background: #f1f5f9; color: #475569; }
        a { color: var(--primary); }
        @keyframes pop { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-wrap { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 1000; display: flex; flex-direction: column; gap: .6rem; }
        .toast { background: var(--dark); color: var(--white); padding: .8rem 1.2rem; border-radius: 8px; font-size: .9rem; box-shadow: var(--shadow-lg); animation: slideIn .25s ease; }
        .toast.success { background: var(--green); } .toast.error { background: var(--red); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .search { padding: .65rem .9rem; border: 2px solid var(--border); border-radius: 8px; font-size: .9rem; width: 260px; }
        .pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
        .pos-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--white); }
        .pos-card.pos-empty { opacity: .85; }
        .pos-head { display: flex; justify-content: space-between; align-items: center; padding: .8rem 1rem; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .pos-head h4 { font-size: .95rem; }
        .pos-head .pos-count .chip { padding: .25rem .7rem; }
        .pos-body { padding: .4rem .6rem; max-height: 260px; overflow-y: auto; }
        .pos-table { width: 100%; border-collapse: collapse; }
        .pos-table td { padding: .35rem .5rem; border: none; border-bottom: 1px solid var(--border); font-size: .85rem; white-space: nowrap; }
        .pos-table tr:last-child td { border-bottom: none; }
        .pos-table .pos-time { text-align: right; color: var(--gray); }
        .pos-table .muted { color: var(--gray); }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .dot-on { background: var(--green); }
        .dot-off { background: var(--border); }
        .empty { text-align: center; color: var(--gray); padding: 2.5rem; }
        .empty i { font-size: 2.2rem; opacity: .4; margin-bottom: .6rem; }
        .progress { height: 8px; background: var(--light); border-radius: 6px; overflow: hidden; margin-top: .5rem; }
        .progress div { height: 100%; background: var(--green); }
        .ml { margin-left: auto; }
        .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.2); margin-right: .3rem; }
        @media (max-width: 900px) {
            .sidebar { width: 60px; padding: 1rem 0; }
            .sidebar .brand span, .sidebar .nav-item span, .sidebar .brand small { display: none; }
            .sidebar .brand { justify-content: center; padding: 0 0 1rem; }
            .sidebar .nav-item { justify-content: center; padding: .9rem 0; }
            .main { margin-left: 60px; padding: 1rem; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <i class="fas fa-hard-hat"></i>
            <div><h2>MANPOWER<span></span></h2><small>Live Attendance Portal</small></div>
        </div>
        <div class="nav-item active" data-view="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
        <div class="nav-item" data-view="workers"><i class="fas fa-users"></i><span>Workers</span></div>
        <div class="nav-item" data-view="import"><i class="fas fa-file-upload"></i><span>Import Attendance</span></div>
        <div class="nav-item" data-view="report"><i class="fas fa-file-alt"></i><span>Daily Report</span></div>
        <div class="nav-item" data-view="positions"><i class="fas fa-people-arrows"></i><span>By Position</span></div>
        <div class="nav-item" data-view="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
    </aside>

    <main class="main" id="mainArea">
        <!-- Views injected here -->
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal" id="modalBox"></div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="app.js"></script>
</body>
</html>
